<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spaßzentrale</title>

<!-- Favicon & Apple Touch Icon -->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

<!-- Open Graph / Social Media Vorschau -->
    <meta property="og:title" content="Spaßzentrale">
    <meta property="og:description" content="Der nächste Frittwoch, Memes und limitierter Merch aus der Aka.">
    <!-- Hier liegt jetzt das kleine, stark komprimierte Bild speziell für WhatsApp -->
    <meta property="og:image" content="https://spa%C3%9Fzentrale.de/gruppenfoto-wa.jpg">
    <meta property="og:url" content="https://spa%C3%9Fzentrale.de/">
    <meta property="og:type" content="website">

    <style>
        :root {
            --red: #cc1414;
            --black: #111111;
            --white: #ffffff;
            --grey: #f4f4f4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--white);
            color: var(--black);
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
        }

        /* --- WUNSCH-FELD --- */
        .wish-container {
            margin-top: 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }
        .wish-container label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            color: #888;
        }
        .wish-form {
            display: flex;
            width: 100%;
            max-width: 350px;
            border-bottom: 2px solid var(--grey);
	    border-top: 2px solid var(--grey);
            transition: border-color 0.2s ease;
        }
        .wish-form:focus-within {
            border-color: var(--red);
        }
        .wish-form input {
            flex-grow: 1;
            border: none;
            background: transparent;
            padding: 0.8rem 0;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            outline: none;
            color: var(--black);
        }
        .wish-form input::placeholder {
            color: #ccc;
            font-weight: 400;
        }
        .wish-form button {
            background: transparent;
            border: none;
            color: var(--black);
            font-size: 1.5rem;
            font-weight: 900;
            cursor: pointer;
            padding: 0 0.5rem;
            transition: color 0.2s ease, transform 0.2s ease;
        }
        .wish-form button:hover {
            color: var(--red);
            transform: translateX(3px);
        }

        /* --- NAVIGATION --- */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 3.5rem 3rem; /* Größerer Abstand am Seitenanfang */
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            z-index: 100;
            border-bottom: 1px solid #eaeaea;
            transition: padding 0.3s ease, background-color 0.3s ease; /* Weicher Übergang */
        }

        .logo {
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1.5px;
            color: var(--red);
        }

/* Sorgt dafür, dass der Logo-Link gewohnt rot bleibt und keine Unterstreichung hat */
        .logo a {
            color: var(--red);
            text-decoration: none;
            font-size: 4rem; /* Große Einstiegsgröße */
            line-height: 1;
            transition: font-size 0.3s ease; /* Weiches Schrumpfen */
        }

	/* ZUSTAND BEIM SCROLLEN (exakt synchron mit shop.html) */
        nav.scrolled {
            padding: 1.5rem 3rem; /* Von 1rem auf 1.5rem angepasst */
        }

        nav.scrolled .logo a {
            font-size: 2.2rem;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            align-items: center;
        }

        .nav-links a {
            color: var(--black);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: var(--red);
        }

        .shop-link {
            color: var(--red) !important;
            border: 2px solid var(--red);
            padding: 0.5rem 1rem;
            transition: all 0.2s ease !important;
        }

        .shop-link:hover {
            background-color: var(--red);
            color: var(--white) !important;
        }

        /* --- HERO BANNER ABSTAND --- */
        .hero-banner {
            width: 100%;
            margin-top: 170px; /* Erhöht, damit das große Logo am Anfang nichts verdeckt */
            background-color: var(--grey);
            border-bottom: 2px solid var(--grey);
        }

        /* --- SECTIONS --- */
        section {
            padding: 8rem 2rem 6rem;
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            align-items: center;
	}

        .section-header {
            text-align: center;
            margin-bottom: 4rem;
        }

        .section-header h2 {
            font-size: 4rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1.5px;
            color: var(--black);
            margin-bottom: 0.5rem;
        }

        .section-header p {
            color: #666;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 600;
        }

        /* --- FRITTWOCH INFO --- */
        .next-event {
            width: 100%;
            max-width: 900px;
            margin-bottom: 4rem;
            padding: 2rem 0;
            border-top: 2px solid var(--black);
            border-bottom: 2px solid var(--black);
            text-align: center;
        }

        .next-event h3 {
            font-size: 1.8rem;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 1rem;
        }

        .next-event h3 span {
            color: var(--red);
        }

        /* --- SPEISEKARTE --- */
        .menu-container {
            width: 100%;
            max-width: 900px;
            border: none;
            background-color: var(--white);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .menu-image {
            width: 100%;
            height: auto;
            display: block;
        }

        /* --- MEMES GALLERY --- */
        #memes {
            background-color: var(--grey);
            border-top: 1px solid #eaeaea;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            width: 100%;
            max-width: 1200px;
        }

        .meme-card {
            background: var(--white);
            aspect-ratio: 4/5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #bbb;
            font-size: 1.2rem;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* Spezielles Styling für Video-Karten (Shorts) im Raster */
        .video-card {
            background-color: var(--black);
            padding: 0;
            overflow: hidden;
            /* Flexbox sorgt dafür, dass das Video perfekt zentriert wird */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-card iframe {
            width: 100%;
            height: 100%; /* Das Short nutzt die volle Höhe der 4:5 Karte */
            border: none;
        }

        .meme-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 45px rgba(0,0,0,0.1);
        }

        /* --- FOOTER --- */
        footer {
            background-color: var(--black);
            color: var(--white);
            padding: 4rem 2rem;
            text-align: center;
            display: flex;
            justify-content: center;
        }

        .footer-links {
            display: flex;
            gap: 2rem;
        }

        .footer-links a {
            color: #888;
            text-decoration: none;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.2s ease;
        }

        .footer-links a:hover {
            color: var(--white);
        }

        /* --- RESPONSIVE / MOBILE ANPASSUNGEN (STATISCH & GROSS) --- */
        @media (max-width: 768px) {
            nav {
                padding: 1.2rem 1rem 0.8rem;
                flex-direction: column;
                gap: 0.6rem;
                align-items: center;
            }

            /* Das Logo bleibt dauerhaft groß und präsent */
            .logo a {
                font-size: 2.4rem !important;
                letter-spacing: -1.5px;
            }

            .nav-links {
                gap: 1.2rem;
            }

            .nav-links a {
                font-size: 0.85rem;
            }

            /* Kein Verkleinern des Logos beim Scrollen mehr */
            nav.scrolled .logo a {
                font-size: 2.4rem !important;
            }

            nav.scrolled {
                padding: 0.8rem 1rem 0.6rem;
            }

            /* Hero-Banner sitzt sauber unter der Navigationsleiste ohne verdeckt zu werden */
            .hero-banner { 
                margin-top: 120px; 
            }

            /* Anker-Sprünge stoppen exakt unter der Navigationsleiste */
            section {
                scroll-margin-top: 0px;
            }

            .section-header h2 { 
                font-size: 2.2rem; 
            }
        }
    </style>
</head>
<body>

    <nav>
       <div class="logo"><a href="#">Spaßzentrale</a></div>
        <div class="nav-links">
            <a href="#frittwoch">Frittwoch</a>
            <a href="#memes">Memes</a>
            <a href="shop.html" class="shop-link">Shop</a>
        </div>

    </nav>
	<div class="hero-banner">
        <img src="gruppenfoto.jpg" alt="Die Spaßzentrale Crew" style="width: 100%; height: auto; 	display: block;">
    </div>

    <section id="frittwoch">
        <div class="section-header">
            <h2>Frittwoch</h2>
            <p>Wenn dann Mittwoch</p>
        </div>
        
        <div class="next-event">
            <h3>Nächster Frittwoch: <span>21. Oktober</span></h3>
            <p>Wir bauen die Fritteusen auf. Kommt vorbei und bringt Hunger mit. Solange der Vorrat reicht.</p>
<!-- Das neue, dezente Wunsch-Feld -->
            <div class="wish-container">
                <label for="wunsch">Was soll als nächstes in die Fritteuse?</label>
                <form class="wish-form" action="https://formspree.io/f/moeeoazv" method="POST">
                    <!-- Verstecktes Feld, damit du in der E-Mail weißt, worum es geht -->
                    <input type="hidden" name="Kategorie" value="*** NEUER FRITTWOCH WUNSCH ***">
                    
                    <input type="text" id="wunsch" name="Wunsch" placeholder="z.B. Käsekrokette..." required>
                    <button type="submit">→</button>
                </form>
            </div>
        </div>

        <!-- NEU: Fertige Speisekarte -->
        <div class="menu-container">
            <img src="speisekarte.jpg" alt="Frittwoch Speisekarte" class="menu-image">
        </div>
    </section>

    <section id="memes">
        <div class="section-header">
            <h2>Aktuelle Memes</h2>
            <p>Archiv der Schande</p>
        </div>
        <div class="gallery">
          <!-- YouTube Short Meme -->
            <div class="meme-card video-card">
                <iframe 
                    src="https://www.youtube.com/embed/bYsHFpOpJ8U?rel=0&modestbranding=1" 
                    title="Frittwoch Meme" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen>
                </iframe>
            </div>
            <div class="meme-card"></div>
            <div class="meme-card"></div>
        </div>
    </section>

    <!-- Der neue cleane Footer -->
    <footer>
        <div class="footer-links">
            <a href="datenschutz.html">Datenschutz</a>
            <a href="kontakt.html">Kontakt</a>
        </div>
    </footer>
<script>
        // Erkennt das Scrollen und schaltet die Klasse .scrolled ein/aus
        window.addEventListener('scroll', () => {
            const nav = document.querySelector('nav');
            if (window.scrollY > 30) {
                nav.classList.add('scrolled');
            } else {
                nav.classList.remove('scrolled');
            }
        });
    </script>
</body>
</html>
